- assessment: Nearly all third-party actions in ci.yml and release.yml are pinned
    to full commit SHAs. coverallsapp/github-action@v2 is pinned only to a mutable
    tag, and it receives GITHUB_TOKEN. dawidd6/action-get-tag is archived (noted in
    a TODO) but is SHA-pinned. Other workflows were not inspected.
  component_ids:
  - component-4ae14de3062e9ced
