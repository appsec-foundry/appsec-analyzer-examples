    line: 88
    basis: confirmed-exploitable
  description: A command line is assembled from application values and handed to a
    shell. Shell syntax in those values runs as further commands with the privileges
    of the service.
  structural_recommendation: call a fixed executable with an argument list and no
    shell, and accept only allowlisted argument values from callers
