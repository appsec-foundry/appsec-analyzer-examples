verdict:
  severity: red
  opening: This is an intentionally vulnerable online shop where unauthenticated visitors
    can bypass login, read the database and create administrator accounts. It should
    run only as an isolated training target and must never hold real customer data
    or be reachable from outside a training network.
  bullets:
  - title: Login bypass and database exposure
    body: SQL injection in sign-in and product search lets anonymous visitors log
      in as any user, including administrators, and read stored data.
    findings:
    - F-004
    - F-005
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Another customer's wallet charged
    body: Checkout trusts a user identifier sent by the browser (missing ownership
      check), so a signed-in customer can spend another customer's balance.
    findings:
    - F-011
    weaknesses:
    - W-003
    verified_attack_path: false
  - title: Anyone can become an administrator
    body: Registration accepts a role chosen by the caller (mass assignment), so an
      anonymous visitor can create an administrator account.
    findings:
    - F-044
    - F-045
    weaknesses:
    - W-022
    verified_attack_path: true
  - title: Forged logins for any account
    body: The token signing key is committed in the source code, so anyone with repository
      access can impersonate any user or role.
    findings:
    - F-023
    weaknesses:
    - W-010
    verified_attack_path: true
  - title: Sensitive files and routes open to the public
    body: Key and log folders and state-changing routes work without authentication,
      letting anonymous visitors download key material or modify data.
    findings:
    - F-039
    weaknesses:
    - W-009
    - W-003
    verified_attack_path: false
  closing: Treat this system as a controlled training target only; fixing the access,
    data-handling and secret-storage design is required before it could hold real
    data.
  bullets_intro: 'Security concerns behind this assessment:'
