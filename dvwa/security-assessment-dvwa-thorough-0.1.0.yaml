- id: M-007
  title: docker-compose secrets supplied by reference
  kind: fix
  priority: P2
  severity: High
  threat_ids:
  - T-027
  how: Move the value to Compose `secrets` or an untracked env file and reference
    it as `${VAR}`; rotate the committed value — A credential written as a literal
    in a service's `environment` is readable by everyone with repository access and
    runs unchanged wherever the file is deployed.
  effort: Low
  auto_emitted: true
  auto_source: config-scan
  _title_source: docker-compose secrets supplied by reference
  steps:
  - Replace the literal MYSQL_ROOT_PASSWORD and MYSQL_PASSWORD values with MYSQL_ROOT_PASSWORD_FILE
    and MYSQL_PASSWORD_FILE that point to Docker secrets, or with variables from an
    untracked .env file excluded from version control.
  - Generate strong, random, unique passwords for each deployment.
  - Rotate the credentials that have already been exposed.
  verification: Run grep -nE 'MYSQL_(ROOT_)?PASSWORD=' compose.yml and confirm that
    it returns no literal values. Then confirm that the database starts using the
    secret files.
  reference: https://cwe.mitre.org/data/definitions/798.html
  file: compose.yml
  line: 31
- id: M-008
  title: Dockerfile USER directive
  kind: fix
  priority: P3
  severity: Medium
  threat_ids:
  - T-074
  how: Add USER <non-root-uid> — Containers running as root expand container-escape
    blast radius.
  effort: Low
  auto_emitted: true
  auto_source: config-scan
  _title_source: Dockerfile USER directive (non-root)
  steps:
