tier_root_causes:
  edge:
  - Untrusted data rendered as HTML via sanitizer bypass and document.write
  - Session token kept in script-readable storage without CSP
  - Client-side logic trusted for credentials, identity and role decisions
  - Secrets and sensitive values placed in URLs, bundles or sent to backend
  - OAuth implicit flow lacks state, PKCE and server-side token validation
  server:
  - Object ownership derived from request input instead of session identity
  - Request data concatenated into SQL, NoSQL, template or eval interpreters
  - Routes registered without authentication or authorization middleware
  - JWTs decoded without signature or algorithm verification; weak token generation
  - Business limits enforced only in prompts or clients, not server-side
  data:
  - Passwords hashed with fast unsalted MD5 instead of adaptive hash
