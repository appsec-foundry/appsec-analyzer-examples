  domain: Operations Runtime and Supply Chain Controls
  effectiveness: Partial
  evidence:
  - file: .github/workflows/ci.yml
    line: 29
  - file: .github/workflows/ci.yml
    line: 188
  - file: .github/workflows/release.yml
    line: 16
  implementation: ci.yml:29,188; release.yml:80
- assessment: package-lock=false means no lockfile is generated. CI and the Docker
    build use npm install, not npm ci. Release and Docker builds also install global
    tools by floating semver ranges (typescript ^6.0.3, cyclonedx-npm range, unpinned
    grunt-cli). Release artifacts are therefore not reproducible, and a compromised
    dependency release would flow into published images and archives. The lint job
    uses --ignore-scripts, but the other jobs do not.
  component_ids:
  - component-4ae14de3062e9ced
  control: Dependency lockfile and install integrity
  domain: Operations Runtime and Supply Chain Controls
  effectiveness: Weak
  evidence:
  - file: .npmrc
