  mitigation_title: Restrict included files to a fixed allowlist
  remediation:
    effort: Low
    reference: https://cwe.mitre.org/data/definitions/98.html
    steps:
    - Apply the impossible.php allowlist (in_array with strict comparison) at every
      security level, or map the page parameter to a fixed array of allowed files
      and include only entries from that map.
    - Reject values that contain path separators or stream wrappers, and confirm that
      the realpath lies inside the fi directory.
    - Set allow_url_include=Off and restrict open_basedir to the application directory.
    verification: Request ?page=../../../../etc/passwd and ?page=http://example.com/x.txt
      at each level. Confirm that the response is 'File not found' and contains no
      file contents such as root:x:0:0.
  risk: High
  scenario: At the low security level, low.php assigns $_GET['page'] to $file, and
    vulnerabilities/fi/index.php:36 passes it unchecked to include(). The only control
    is authentication through dvwaPageStartup. The impossible level limits the parameter
    to an allowlist of filenames. An authenticated user sets the security level to
    low through security.php and requests vulnerabilities/fi/?page=../../../../etc/passwd,
    a php:// wrapper, or the path of a log file. include() then renders arbitrary
    readable local files. If the attacker injects PHP into a log file the server can
    read and then includes that file, the code runs as the web server user.
