  cases:
  - id: AC-T-005
    title: Authentication Bypass via Exposed Secret Material
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Forge trusted tokens / credentials and impersonate any user.
    prerequisite: Signing material or other secrets are reachable (committed to a
      public repo, served by an unauthenticated route, or in an exposed directory).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-023
    - F-016
    blocking_mitigation_ids:
    - M-042
    - M-037
    steps:
    - step: 1
      outcome: A private key, signing secret, or credential file is committed to the
        source repository or served without authentication.
      verdict: confirmed
      finding_id: F-023
      evidence:
        file: lib/insecurity.ts
        line: 21
      controls_found: []
      unverified: false
    - step: 2
      outcome: The exposed key/secret is the same one the server trusts, so a token
        signed with it (or the leaked credential) is accepted as authentic.
      verdict: confirmed
      finding_id: F-016
      evidence:
        file: routes/verify.ts
        line: 120
      controls_found: []
      unverified: false
  - id: AC-B-007
    title: User misuses a privileged function for another purpose
    source: descriptive
    actor: attacker
    goal: ''
    prerequisite: ''
    combined_risk: High
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-044
    blocking_mitigation_ids:
    - M-061
    steps:
    - step: 1
      outcome: Check whether a user can make a privileged function, such as support
        impersonation, an administrative action, or a background job, act on resources
        or perform operations outside that user's own authority.
      verdict: confirmed
      finding_id: F-044
      evidence:
        file: server.ts
        line: 363
      controls_found:
      - security.isAuthorized() authentication-only check on GET /api/Users (does
        not enforce a role or ownership boundary)
      unverified: false
    open_questions:
    - Which operations may support staff perform while acting as a customer?
  - id: AC-T-004
    title: Privilege Escalation via Mass-Assignment on Registration
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Obtain an administrator account without any existing privilege.
    prerequisite: Self-registration is open (one unauthenticated POST).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-044
    blocking_mitigation_ids:
    - M-061
    steps:
    - step: 1
      outcome: The account-creation handler persists the request body wholesale, so
        a client-supplied `role` (or `isAdmin`) field is written verbatim.
      verdict: confirmed
      finding_id: F-044
      evidence:
        file: server.ts
        line: 420
      controls_found: []
      unverified: false
  - id: AC-T-006
    title: Remote Code Execution via Server-Side Injection
    source: mandatory
    actor: Internet Attacker — unauthenticated external attacker
    goal: Execute arbitrary code in the application process.
    prerequisite: An input reaches a server-side interpreter / template / eval.
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-038
    blocking_mitigation_ids:
    - M-056
    steps:
    - step: 1
      outcome: Attacker-controlled input is passed to `eval`, a server-side template
