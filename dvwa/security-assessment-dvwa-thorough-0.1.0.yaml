    effort: Low
    reference: https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
    steps:
    - Parse the parameter with URLSearchParams and check it on the client against
      a fixed language allowlist before using it.
    - Create option elements with document.createElement and set value and textContent
