    metadata address, to /profile/image/url (routes/profileImageUrlUpload.ts:24).
    The server fetches it with no scheme, host or private-address restriction and
    writes the response body into the public uploads directory, where the attacker
    downloads it. An SVG body would also be served same-origin. Only a cookie login
    check applies.
