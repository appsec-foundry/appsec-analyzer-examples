    with no signature or nonce proof of ownership and no authentication check in these
    handlers. A caller can claim any address. The on-chain event check partly limits
    the effect, because the address must have minted or exploited on-chain. The addresses
    minted and connected are held in unbounded in-memory Sets that are shared by all
    callers.
