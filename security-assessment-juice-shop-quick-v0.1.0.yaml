verdict:
  severity: red
  opening: This web shop lets anonymous visitors bypass sign-in, read the customer
    database and run commands on the server. It should run only as an isolated training
    target, never holding real customer data or reachable from the internet.
  bullets:
  - title: Login bypass and database exposure
    body: SQL injection in login and product search lets anonymous visitors sign in
      as anyone and read other tables, including password hashes.
    findings:
    - F-010
    - F-003
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Server takeover by a signed-in user
    body: Code injection through the profile name lets any registered user run commands
      on the server.
    findings:
    - F-011
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Other customers' data read and changed
    body: Missing ownership checks (IDOR) let any signed-in customer read and modify
      another customer's records.
    findings:
    - F-008
    - F-009
    weaknesses:
    - W-003
    verified_attack_path: false
  - title: Anyone can register as administrator
    body: Mass assignment on account registration lets an unauthenticated visitor
      create an account with the administrator role.
    findings:
    - F-036
    weaknesses: []
    verified_attack_path: false
  - title: Forged logins from published signing key
    body: The token signing key is committed to source, so anyone with repository
      access can mint valid logins for any user.
    findings:
    - F-018
    weaknesses:
    - W-006
    verified_attack_path: false
  closing: Until these gaps are closed, a breach would expose every customer record
    and give attackers full control of the server and its accounts.
  bullets_intro: 'Security concerns behind this assessment:'
