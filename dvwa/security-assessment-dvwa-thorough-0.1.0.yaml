  evidence_basis: llm-verified
  evidence_check: verified
  evidence_summary: Line 31 sets ALLMYSECRETS to toJSON(secrets); lines 51 and 54
    pipe SUPER_SECRET and ALLMYSECRETS through base64 into the log, defeating masking.
    Triggered on push to master (lines 3-6). Log readership depends on repository
    visibility, not shown in source.
  evidence_tier: insecure-practice
  found_by:
  - survey
  impact: High
  likelihood: High
  local_id: part-1-3fb0ad3840b7cbe7
  mitigation_title: Remove secret dumping step from vulnerable workflow
  primary_actor: ACT-D-06
  remediation:
    effort: Low
    reference: https://cwe.mitre.org/data/definitions/532.html
    steps:
    - Delete the get_secrets job from .github/workflows/vulnerable.yml, or the whole
      workflow if it serves only as a demo.
    - Never pass toJSON(secrets) into a step; reference only the individual secrets
      a step needs.
    - Rotate DVWA_SECRET_KEY and any other repository secrets that have been exposed
      in historical run logs, and delete those logs.
    verification: Run `grep -rn "toJSON(secrets)\|base64" .github/workflows/` and
      confirm no match remains in any step that handles secrets; inspect the next
      master run log for absence of encoded output.
  risk: High
  scenario: On every push to master the get_secrets job serialises all repository
    secrets via toJSON(secrets) into ALLMYSECRETS and echoes it through base64. GitHub
    log masking only matches the literal secret values, so the encoded blob is shown
    in clear. Anyone able to read the Actions logs (any user if the repository is
    public) decodes it and obtains every secret, including DVWA_SECRET_KEY and the
    run's GITHUB_TOKEN.
  source: stride
