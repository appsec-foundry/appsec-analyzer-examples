  mitigation_title: Use parameterized / bound queries (placeholders + a values array,
    or an ORM's safe query builder); never interpolate request data into the SQL string.
  primary_actor: ACT-D-01
  remediation:
    effort: Low
    reference: https://cwe.mitre.org/data/definitions/89.html
    steps:
    - Replace the interpolated SQL with sequelize.query using named replacements or
      bind parameters for the LIKE pattern.
    - Escape LIKE wildcards in the input before binding.
    - Reject non-string q values.
    verification: Request /rest/products/search?q=' UNION SELECT id,email,password
      FROM Users-- and confirm no user rows are returned and no SQL error occurs.
  risk: Critical
  scenario: An unauthenticated caller sends GET /rest/products/search?q= with a quote-closing
    UNION payload at routes/search.ts:23. The q value is concatenated into a raw SQL
    string, so the caller can read other tables such as Users, including emails and
    password hashes, which come back in the JSON product list. The only control is
    truncation of q to 200 characters, and the route has no authentication. The scanner
    finding at the same location also notes that interpolating request text into SQL
    can allow modifying rows or escalating to full database control.
