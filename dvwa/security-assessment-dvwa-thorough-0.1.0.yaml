  mitigation_title: Store passwords with password_hash using bcrypt or Argon2
  remediation:
    effort: Medium
    reference: https://cwe.mitre.org/data/definitions/916.html
    steps:
    - Widen the password column during setup so it can hold password_hash() output.
    - Replace md5() with password_hash($pass, PASSWORD_ARGON2ID), or PASSWORD_BCRYPT
      with a cost of at least 12, wherever passwords are stored.
    - Select the user by name and verify with password_verify() in login.php and test_credentials.php.
    - 'Add a server-side policy check on password change and registration: a minimum
      length of 12 and a block list of common passwords.'
    - Migrate existing MD5 hashes by rehashing at the next successful login, and force
      a reset for accounts that have not migrated.
    verification: Change a password through the captcha and CSRF forms, then run SELECT
      password FROM users WHERE user='admin'. Confirm the value starts with $argon2id$
      or $2y$12$, that login still succeeds, and that submitting 'abc' as the new
      password is rejected.
  risk: High
  scenario: Passwords are stored and compared as unsalted MD5. This happens in the
    password change at vulnerabilities/captcha/source/impossible.php:14, at vulnerabilities/csrf/source/impossible.php:29
    (every CSRF level, including impossible, stores unsalted md5) and at login.php:27.
    The parts also note md5 at captcha/impossible.php lines 19 and 24, in csrf low.php:12,
    medium.php:14 and high.php:39, and in the brute login files. MD5 is collision-broken
    and fast. In the captcha password change, the new password is written to users.password
    with no minimum length or strength rule. The current password is verified and
    the two new entries must match, but neither is a hashing control or a strength
    policy. An attacker who obtains the users table, for example through the SQL injection
    pages of the same application or the database, can crack the hashes quickly with
