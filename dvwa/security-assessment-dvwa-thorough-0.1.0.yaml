    describe two related problems. First, login.php authenticates against these seeded
    rows, and setup.php:105 even advertises admin // password. Anyone who can reach
    /login.php reads the anti-CSRF token from the form, submits admin and password,
    and the query at login.php:39 matches the seeded row and creates a session. Second,
    the password column is varchar(32) and holds raw MD5 with no salt or work factor.
