tier_root_causes:
  server:
  - Request input concatenated into SQL, shell, include and eval sinks
  - Output rendered without context-aware HTML/JS/attribute encoding
  - Authorization and security state trusted from client cookies and fields
  - 'Hardcoded keys and weak crypto: unsalted MD5, unauthenticated CBC/ECB, XOR'
  - Unpinned CI/container supply chain with over-privileged tokens and root
  data:
  - Static committed DB root/app credentials reused across every deployment
  - DB access gated only by network position, not per-deployment secrets
