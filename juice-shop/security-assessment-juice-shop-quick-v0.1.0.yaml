verdict:
  severity: red
  opening: This deliberately vulnerable web shop lets anonymous internet users take
    over accounts and run code on the server. Acceptable only as an isolated training
    target; it must never hold real data or be reachable outside a training network.
  bullets:
  - title: Anonymous login bypass and data theft
    body: SQL injection in login and product search lets unauthenticated users sign
      in as others and dump the user database.
    findings:
    - F-012
    - F-007
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Server takeover through code execution
    body: A signed-in user can plant code in their profile name that the server then
      executes (server-side code injection).
    findings:
    - F-013
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Other customers' records read and changed
    body: Missing ownership checks (IDOR) let any signed-in customer read or change
      another customer's records.
    findings:
    - F-001
    - F-005
    weaknesses:
    - W-004
    verified_attack_path: false
  - title: Ordinary accounts become administrators
    body: Mass assignment on registration lets anyone supply a privileged role field
      and create an administrator account.
    findings:
    - F-039
    weaknesses:
    - W-006
    verified_attack_path: false
  - title: Hard-coded secrets allow forged logins
    body: Signing secrets committed to source let anyone with repository access forge
      login tokens for any user.
    findings:
    - F-034
    weaknesses:
    - W-009
    verified_attack_path: false
  - title: Browser script injection steals sessions
    body: Missing output encoding lets injected script run in visitors' browsers and
      read their stored login tokens.
    findings:
    - F-002
    weaknesses:
    - W-008
    verified_attack_path: false
  closing: Treat this system as a controlled training exercise only; real customers
    or production data would be fully exposed.
  bullets_intro: 'Security concerns behind this assessment:'
