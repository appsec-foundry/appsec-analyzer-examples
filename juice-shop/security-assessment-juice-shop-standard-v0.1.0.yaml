  mitigation_title: Bind UserId to the authenticated user with appendUserId
  primary_actor: ACT-D-01
  remediation:
    effort: Low
    reference: https://cwe.mitre.org/data/definitions/639.html
    steps:
    - Add security.appendUserId() to the POST /api/PrivacyRequests route so UserId
      comes from the verified token and not the request body.
    - Reject or ignore client-supplied UserId and deletionRequested fields in the
      finale create hook.
    verification: As user A, POST /api/PrivacyRequests with another user's UserId
      in the body, and confirm the stored UserId is A's id or the request is rejected.
  risk: Medium
  scenario: Any authenticated user can POST /api/PrivacyRequests. The route is guarded
    only by security.isAuthorized(), which verifies the JWT. It does not call security.appendUserId(),
    which the Cards and Addresss routes use. The finale-generated create endpoint
    therefore takes UserId and deletionRequested from the request body, so an attacker
    can file a data-erasure request on behalf of another user's id.
  source: stride
  stride: Elevation of Privilege
  threat_category_id: TH-06
