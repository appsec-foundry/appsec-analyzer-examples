abuse_case_analysis:
  status: completed
  reason: null
  cases:
  - id: AC-T-002
    title: Bulk Data Exfiltration via Broken Object Authorization
    source: mandatory
    actor: Authenticated Internet Attacker — authenticated low-privilege user
    goal: Enumerate and exfiltrate other users' records, then escalate own permissions
      via unguarded mass assignment.
    prerequisite: Attacker holds a valid, non-privileged user account.
    combined_risk: Medium
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-073
    - F-076
    blocking_mitigation_ids:
    - M-076
    - M-079
    steps:
    - step: 1
      outcome: Attacker enumerates and retrieves records for arbitrary object IDs;
        no ownership comparison is performed.
      verdict: confirmed
      finding_id: F-073
      evidence:
        file: vulnerabilities/bac/source/low.php
        line: 33
      controls_found: []
      unverified: false
    - step: 2
      outcome: Update endpoint persists an unfiltered `role` (or equivalent) field
        supplied in the request body.
      verdict: confirmed
      finding_id: F-076
      evidence:
        file: vulnerabilities/api/src/UserController.php
        line: 225
      controls_found: []
      unverified: false
  - id: AC-T-004
    title: Privilege Escalation via Mass-Assignment on Registration
    source: mandatory
    actor: Anonymous Internet Attacker — unauthenticated external attacker
    goal: Obtain an administrator account without any existing privilege.
    prerequisite: Self-registration is open (one unauthenticated POST).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-076
    blocking_mitigation_ids:
    - M-079
    steps:
    - step: 1
      outcome: The account-creation handler persists the request body wholesale, so
        a client-supplied `role` (or `isAdmin`) field is written verbatim.
      verdict: confirmed
      finding_id: F-076
      evidence:
        file: vulnerabilities/api/src/UserController.php
        line: 225
      controls_found: []
      unverified: false
  - id: AC-T-005
    title: Authentication Bypass via Exposed Secret Material
    source: mandatory
    actor: Anonymous Internet Attacker — unauthenticated external attacker
    goal: Forge trusted tokens / credentials and impersonate any user.
    prerequisite: Signing material or other secrets are reachable (committed to a
      public repo, served by an unauthenticated route, or in an exposed directory).
    combined_risk: Critical
    chain_verdict: fully_viable
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-039
    blocking_mitigation_ids:
    - M-045
    steps:
    - step: 1
      outcome: A private key, signing secret, or credential file is committed to the
        source repository or served without authentication.
      verdict: confirmed
      finding_id: F-039
      evidence:
        file: vulnerabilities/api/src/Token.php
        line: 10
      controls_found: []
      unverified: false
    - step: 2
      outcome: The exposed key/secret is the same one the server trusts, so a token
        signed with it (or the leaked credential) is accepted as authentic.
      verdict: confirmed
      finding_id: null
      evidence:
        file: vulnerabilities/api/src/Token.php
        line: 39
      controls_found: []
      unverified: false
  - id: AC-T-001
    title: Account Takeover via XSS + Token Hijacking
    source: mandatory
    actor: Anonymous Internet Attacker — unauthenticated external attacker
    goal: Obtain persistent authenticated access as an arbitrary user without valid
      credentials.
    prerequisite: Attacker can get markup rendered in a victim's session, through
      stored content (e.g. feedback, comments, profile fields) or a crafted link.
    combined_risk: High
    chain_verdict: inconclusive
    verification_complete: true
    unverified_steps: []
    matched_finding_ids:
    - F-054
    - F-009
    blocking_mitigation_ids:
    - M-060
    steps:
    - step: 1
      outcome: Attacker JavaScript executes in the victim's browser session.
      verdict: confirmed
      finding_id: F-054
      evidence:
        file: vulnerabilities/authbypass/authbypass.js
        line: 45
      controls_found: []
      unverified: false
    - step: 2
      outcome: Token exfiltrated from local/session storage via the Step 1 payload.
      verdict: refuted
      finding_id: F-009
      evidence:
        file: vulnerabilities/xss_d/index.php
        line: 53
      controls_found: []
      unverified: false
    - step: 3
      outcome: Exfiltrated token accepted for a new session; absence of token binding
        / PKCE removes the last server-side revocation opportunity.
      verdict: inconclusive
      finding_id: null
      evidence:
        file: vulnerabilities/api/src/LoginController.php
        line: 117
      controls_found: []
      unverified: false
