  mitigation_title: Pin base image to @sha256:<digest>
  remediation:
    effort: Low
    steps:
    - Reference base images as image:tag@sha256:digest in all Dockerfiles.
    - Use Renovate or Dependabot to update digests.
    - Pin coverallsapp/github-action and github/codeql-action to full commit SHAs
      with version comments.
    - Replace @main and @v8 refs in image_actions.yml with full commit SHAs and add
      explicit least-privilege permissions to the job.
    - Pin actions/checkout@v6 to a SHA as well.
    - Enable Dependabot for github-actions to keep pins current.
    verification: 'Run docker buildx imagetools inspect on each FROM to confirm digests
      match pinned values, and grep workflows for uses: lines lacking a 40-hex SHA
      and confirm none remain.'
  risk: Medium
  scenario: 'Build inputs are referenced by mutable refs. Dockerfile:1 builds from
    node:24 and the distroless runtime by tag, and test/smoke/Dockerfile:1 uses alpine
    by tag, none by digest, so a replaced upstream image would flow into published
    images. In .github/workflows/ci.yml:188, coverallsapp/github-action@v2 is referenced
    by a movable tag and receives GITHUB_TOKEN, and github/codeql-action steps use
    @v3; if a tag is moved to malicious code it runs in CI with the token. In .github/workflows/image_actions.yml:33,
    calibreapp/image-actions@main tracks a mutable branch and receives GITHUB_TOKEN,
    with peter-evans/create-pull-request@v8 on a mutable tag; a change on those upstream
    refs runs attacker code with repository token scope on push to master/develop.
    Mitigations: multi-stage distroless non-root runtime, most other actions SHA-pinned,
    pull request runs limited to same-repository branches and the job restricted to
    the upstream repo. The finding holds further places beyond those cited (location_count
    5).'
