tier_root_causes:
  server:
  - Request data concatenated into SQL, shell commands and file paths unbound
  - Output rendered without context-aware encoding; blocklist filters used instead
  - Authorization trusts client-controlled cookies, form fields and static tokens
  - Secrets, keys and default credentials hardcoded in source, config and CI
  - Fast unsalted hashes and unauthenticated or homegrown token cryptography
  data:
  - Database credentials committed as literals shared by every deployment
  - Database image pulled by mutable tag with no digest verification
