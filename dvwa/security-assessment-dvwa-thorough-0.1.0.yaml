- id: M-011
  title: Use modern cryptographic hash and KDF algorithms
  kind: fix
  priority: P2
  severity: High
  effort: Medium
  threat_ids:
  - T-002
  - T-070
  auto_emitted: true
  auto_source: finding-fix
  prevents:
  - CWE-328
  _title_source: Use password_hash() (bcrypt/argon2) for credentials and hash('sha256',
    …) for integrity.
  steps:
  - Replace md5() with password_hash($pass, PASSWORD_ARGON2ID, or PASSWORD_BCRYPT
    with cost >= 12).
  - Verify passwords with password_verify instead of comparing hashes in SQL.
  - Widen the users.password column to at least VARCHAR(255), and rehash on next login
    with password_needs_rehash.
  - Add a server-side minimum length of at least 12 and a breached-password check
    to all password set and change paths.
  - Use password_hash() (bcrypt/argon2) for credentials and hash('sha256', …) for
    integrity.
  - Add a regression test (or CI check) that fails on the vulnerable pattern and passes
    once the fix is in place.
  verification: Run setup and change a password. Then run SELECT password FROM users
    and assert that each value starts with $2y$ or $argon2id$. Confirm that a change
    to 'abc' is rejected.
  file: dvwa/includes/dvwaPage.inc.php
  line: 651
