    verification: 'grep the workflow files for uses: lines lacking a 40-hex SHA and
      confirm none remain for third-party actions.'
  risk: Medium
  scenario: Third-party actions are referenced by mutable tags or branches, so a compromised
    publisher could retroactively inject malicious code. At .github/workflows/ci.yml:188
    the coverage step uses a floating major tag (v2) and receives the GITHUB_TOKEN,
    while nearly all other actions in that file are pinned to commit SHAs. At .github/workflows/image_actions.yml:33
    the image compression action is referenced by the main branch and receives GITHUB_TOKEN;
    the workflow also runs on pushes to master and develop, so a change on that branch
    executes immediately with repository write access via the token and the follow-up
    PR step. Pull request runs are restricted to same-repository heads, but no permissions
    block limits the token. At .github/workflows/codeql-analysis.yml:23 a tag-based
    action reference was also flagged.
