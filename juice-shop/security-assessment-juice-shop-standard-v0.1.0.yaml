tier_root_causes:
  edge:
  - Angular sanitizer bypass renders untrusted data as trusted HTML
  - Session JWT kept in script-readable localStorage
  - Insecure OAuth implicit flow lacking state, nonce and audience checks
  - Client-side logic and token handling trusted for security decisions
  - Secrets and credentials placed in URLs and client bundle
  server:
  - Object access by request id without ownership predicate
  - Client-supplied identity and privileged fields trusted in bodies
  - Untrusted input concatenated into SQL, NoSQL, eval and template code
  - 'Weak JWT handling: decode-only, no algorithm pin, hardcoded key'
  - Missing auth or role checks; business and LLM rules only in prompts
  data:
  - Stored data left unencrypted at rest
