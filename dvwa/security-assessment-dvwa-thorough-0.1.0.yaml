verdict:
  severity: red
  opening: This is a deliberately vulnerable web application training target, and
    attackers can take over the web server and read or rewrite its whole database.
    It should run only in an isolated lab and never hold real data or be reachable
    from the internet.
  bullets:
  - title: Server takeover through shell commands
    body: Operating-system command injection in the connectivity check lets an unauthenticated
      caller run arbitrary commands as the web server user.
    findings:
    - F-004
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Database read and rewritten by signed-in users
    body: SQL injection across several pages lets any signed-in user read other tables,
      bypass the password check, or overwrite the administrator password.
    findings:
    - F-005
    - F-017
    - F-018
    - F-019
    - F-020
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Database contents leaked through blind queries
    body: Blind SQL injection on cookie and form values lets signed-in users infer
      stored data from yes-or-no page responses.
    findings:
    - F-021
    - F-022
    - F-023
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Anyone can wipe the database
    body: The setup page needs no login, so any visitor can drop and recreate the
      database, resetting every account and record.
    findings:
    - F-024
    weaknesses: []
    verified_attack_path: false
  - title: Ordinary accounts become administrators
    body: Missing authorization and mass assignment on the user interface let unauthenticated
      callers read or change all users, including their access level.
    findings:
    - F-039
    - F-082
    weaknesses:
    - W-004
    - W-012
    verified_attack_path: true
  closing: The system is acceptable only as an isolated training target. Putting it
    near real data or a shared network would expose everything it holds.
  bullets_intro: 'Security concerns behind this assessment:'
