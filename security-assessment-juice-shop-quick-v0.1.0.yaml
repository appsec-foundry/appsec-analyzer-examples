    line: 51
  - file: Dockerfile
    line: 5
  implementation: .npmrc:1; Dockerfile:4-5,19; release.yml:38-40
- assessment: Multi-stage build with a distroless runtime image, a non-root UID 65532,
    and group-writable permissions limited to the needed directories. Base images
    are referenced by tag, not digest. An SBOM is generated at build time.
  component_ids:
  - component-4ae14de3062e9ced
  control: Container image hardening
  domain: Operations Runtime and Supply Chain Controls
  effectiveness: Adequate
  evidence:
  - file: Dockerfile
    line: 22
  - file: Dockerfile
    line: 39
  implementation: Dockerfile:1,22,38-39,20
- assessment: Secrets (DockerHub, Slack, Alchemy) are read from GitHub secrets and
    scoped to individual steps. Neither inspected workflow declares a top-level or
    job-level permissions block, so GITHUB_TOKEN uses the repository default. Releases
    are triggered only by v* tags and created as drafts. The release build has no
    provenance attestation or image signing. Other workflows were not read.
  component_ids:
  - component-4ae14de3062e9ced
  control: CI secrets handling and token scope
  domain: Operations Runtime and Supply Chain Controls
  effectiveness: Partial
  evidence:
  - file: .github/workflows/release.yml
