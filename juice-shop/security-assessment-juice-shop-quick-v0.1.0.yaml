    to mutable tags or branches instead of immutable commit digests, so a retagged
    or compromised upstream runs inside the pipeline with its token and secret scope.
  structural_recommendation: pin every third-party action and build dependency to
    an immutable commit SHA (or a vetted internal mirror) and enforce SHA-pinning
    in CI
