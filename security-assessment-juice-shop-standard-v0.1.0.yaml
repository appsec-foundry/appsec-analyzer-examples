tier_root_causes:
  edge:
  - Angular sanitizer bypassed by marking untrusted data as trusted HTML
  - Session token kept in script-readable browser storage
  - OAuth implicit flow with client-derived credentials
  - Security decisions made client-side on unverified token claims
  - Third-party scripts and styles loaded without integrity pinning or CSP
  server:
  - Object lookups use client-supplied IDs with no ownership check
  - Routes registered without authentication or role middleware
  - Request input concatenated into SQL, NoSQL, template or eval contexts
  - JWT verification lacks algorithm and claim checks; secrets hardcoded
  - Weak credential storage and recovery; sensitive files served publicly
  data:
  - Data stored at rest without encryption
