  mitigation_title: Validate target host and drop shell invocation
  remediation:
    effort: Low
    reference: https://cwe.mitre.org/data/definitions/78.html
    steps:
    - Validate the health target and the exec ip parameter with filter_var(FILTER_VALIDATE_IP),
      or a strict hostname regex for the health target, and reject anything else (422
      on the health route).
    - Remove the '&&' and ';' str_replace blacklist in the medium exec level.
    - Pass validated values through escapeshellarg() before exec or shell_exec, or
      avoid the shell entirely, for example with a socket-based connectivity check.
    - Require a valid bearer token (Login::check_access_token) on the health/connectivity
      route.
    verification: 'Run curl -X POST -H ''Content-Type: application/json'' -d ''{"target":"127.0.0.1;sleep
      10"}'' against /vulnerabilities/api/v2/health/connectivity and confirm it returns
      422 at once, without a 10s delay. Then POST ip=127.0.0.1;id and ip=127.0.0.1|id
      to the exec page at each level and confirm only an invalid-IP error appears,
      with no command output.'
  risk: Critical
  scenario: Request data is concatenated into shell commands, which gives arbitrary
    command execution as the web server user. At vulnerabilities/api/src/HealthController.php:88
    an unauthenticated caller POSTs {"target":"127.0.0.1;id"} to /vulnerabilities/api/v2/health/connectivity.
    The front controller routes the request to HealthController::checkConnectivity
    without authentication, and the target goes unvalidated and unescaped into exec("ping
    -c 4 " . $target), giving code execution on the API host. At vulnerabilities/exec/source/low.php:14
    an authenticated user at the low level POSTs ip=127.0.0.1;cat /etc/passwd to the
    exec page. The value reaches shell_exec unfiltered and the output is echoed in
    the pre block of the response. exec/index.php requires an authenticated DVWA session,
    but there is no input control. At vulnerabilities/exec/source/medium.php:23 the
    medium level strips only '&&' and ';' with str_replace, so ip=127.0.0.1|id or
    127.0.0.1&id reaches shell_exec unchanged. The finding holds 7 places, more than
    the locations cited here.
