verdict:
  severity: red
  opening: This web shop lets attackers reach full server takeover, administrator
    accounts and customer data theft. It should run only as an isolated training target,
    never hold real customer data or payment cards, and never be exposed to the internet.
  bullets:
  - title: Server takeover through code execution
    body: A signed-in customer can run their own code on the server through a stored
      profile name (server-side code injection).
    findings:
    - F-005
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Customer data read and logins bypassed
    body: SQL injection lets anyone without an account read database tables and sign
      in without knowing a password.
    findings:
    - F-004
    - F-010
    weaknesses:
    - W-002
    verified_attack_path: false
  - title: Anyone can become an administrator
    body: Mass assignment on registration lets an anonymous visitor create an account
      with the administrator role.
    findings:
    - F-011
    weaknesses:
    - W-003
    verified_attack_path: true
  - title: Other customers' records exposed
    body: Missing ownership checks (IDOR) let any signed-in customer read and change
      other customers' records.
    findings:
    - F-001
    weaknesses:
    - W-007
    verified_attack_path: true
  - title: Logins can be forged for any user
    body: A hard-coded token signing key in the source lets anyone with repository
      access forge a login for any account.
    findings:
    - F-021
    weaknesses:
    - W-010
    verified_attack_path: true
  closing: Treat the system as unsafe for real users or data until the listed fixes
    are made and independently re-tested.
  bullets_intro: 'Security concerns behind this assessment:'
