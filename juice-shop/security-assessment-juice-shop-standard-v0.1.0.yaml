  primary_actor: ACT-D-01
  remediation:
    effort: Medium
    reference: https://cwe.mitre.org/data/definitions/918.html
    steps:
    - Allow only http/https (https where possible) and resolve the host, rejecting
      loopback, link-local, private and metadata addresses.
    - Disable redirect following or re-validate each hop.
    - Validate the fetched content type and magic bytes as an image, reject svg, and
      cap size.
    - Do not store the raw URL on fetch failure.
    verification: Post imageUrl=http://169.254.169.254/ and imageUrl=http://127.0.0.1:3000/
      to /profile/image/url with a session cookie and confirm both are rejected and
      nothing is written to uploads.
