  mitigation_title: Replace req.body.UserId/userId/ownerId with req.user.id (or equivalent
    session-derived identity) in every WHERE/filter clause.
  primary_actor: ACT-D-01
  remediation:
    effort: Low
    steps:
    - Derive the owner from the authenticated session instead of trusting UserId or
      similar fields in the request body.
    - Look up basket items with BasketId equal to the caller's basket id.
    - Reject the request with 403 or 404 if no owned record matches.
    verification: As one user, send requests naming another user's UserId or basket
      item id on each affected route and confirm a 403 or 404 response and unchanged
      data.
  risk: Critical
  scenario: At routes/memory.ts:15, a signed-in attacker places another user's ID
    in the owner field of the request (req.body.UserId and the like) and the query
    trusts it instead of the session identity, so the attacker can read or change
    other users' records. At routes/basketItems.ts:68, a logged-in user sends PUT
    /api/BasketItems/<id> for an item in another user's basket; the item is found
    by id only and the owner is never compared, although isAuthorized and appendUserId
    authenticate the caller. The result is horizontal privilege escalation across
    accounts. The finding holds further places beyond these two cited locations (location_count
    is 5).
