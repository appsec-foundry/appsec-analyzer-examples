      a version comment.
    - Add an explicit least-privilege permissions block to the image_actions.yml workflow.
    - Enable Dependabot or Renovate for github-actions to update the SHAs.
    verification: 'grep -rnE ''uses: .+@(v[0-9]+|main)$'' .github/workflows returns
      no third-party hits.'
  risk: Medium
  scenario: Workflows reference third-party actions by movable tags or a branch. At
    .github/workflows/ci.yml:188, coverallsapp/github-action@v2 and github/codeql-action@v3
    are tag-referenced. At .github/workflows/image_actions.yml:33, calibreapp/image-actions@main
    tracks a branch head and receives GITHUB_TOKEN. peter-evans/create-pull-request@v8
    and checkout@v6 are also tags. At .github/workflows/codeql-analysis.yml:23, the
    scanner flagged the same kind of unpinned tag reference. If a tag is repointed
    or the publisher is compromised, malicious code runs in push-triggered jobs holding
    GITHUB_TOKEN and can open PRs or alter content. Most other actions are pinned
    to full commit SHAs, and the image workflow only runs for juice-shop/juice-shop.
