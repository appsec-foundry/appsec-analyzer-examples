    v1.3.0, v4.33.0 or @main instead of commit SHAs. These references appear at .github/workflows/docker-image.yml:16,
    .github/workflows/codeql-analysis.yml:45 and .github/workflows/shiftleft-analysis.yml:24.
    Tags can be changed, so they give no integrity guarantee. A publisher who is compromised
    can add malicious code to a tag the workflows already use. An attacker who compromises
    the docker/setup-qemu-action, docker/login-action, docker/setup-buildx-action
    or ShiftLeftSecurity/scan-action repository, or who points a tag at a different
    commit, gets code run in the job. That job holds a GITHUB_TOKEN that can push
    packages. The attacker can then steal the token or publish a backdoored DVWA image
    to ghcr.io.
