  mitigation_title: Use password_hash() (bcrypt/argon2) for credentials and hash('sha256',
    …) for integrity.
  remediation:
    effort: Medium
    steps:
    - Replace md5() with password_hash($pass, PASSWORD_ARGON2ID, or PASSWORD_BCRYPT
      with cost >= 12).
    - Verify passwords with password_verify instead of comparing hashes in SQL.
    - Widen the users.password column to at least VARCHAR(255), and rehash on next
      login with password_needs_rehash.
    - Add a server-side minimum length of at least 12 and a breached-password check
      to all password set and change paths.
    verification: Run setup and change a password. Then run SELECT password FROM users
      and assert that each value starts with $2y$ or $argon2id$. Confirm that a change
      to 'abc' is rejected.
  risk: High
  scenario: dvwa/includes/dvwaPage.inc.php:651 uses a broken hash primitive (MD5/SHA-1).
    These algorithms are collision-broken and unsafe for passwords or for the integrity
    of untrusted data. User passwords are stored and verified as unsalted MD5, including
    on the captcha impossible path at vulnerabilities/captcha/source/impossible.php:14.
    That path uses prepared statements and checks the current password, but it still
    stores MD5. An attacker who obtains the users table, for example through the application's
    SQL injection or error leakage, can crack the hashes almost instantly with rainbow
    tables or GPU brute force and then log in as any user. Password change paths also
    accept any new password without length or complexity checks. The finding holds
    5 places, more than the locations cited here.
