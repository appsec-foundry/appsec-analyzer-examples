- id: M-012
  title: docker-compose secrets supplied by reference
  kind: fix
  priority: P2
  severity: High
  threat_ids:
  - T-028
  how: Move the value to Compose `secrets` or an untracked env file and reference
    it as `${VAR}`; rotate the committed value — A credential written as a literal
    in a service's `environment` is readable by everyone with repository access and
    runs unchanged wherever the file is deployed.
  effort: Low
  auto_emitted: true
  auto_source: config-scan
  _title_source: docker-compose secrets supplied by reference
  steps:
  - Replace the literal MYSQL_ROOT_PASSWORD and MYSQL_PASSWORD values with MYSQL_ROOT_PASSWORD_FILE
    and MYSQL_PASSWORD_FILE pointing to Docker secrets, or with ${MYSQL_ROOT_PASSWORD:?}
    style references loaded from an untracked .env file.
  - Document how to generate a unique strong random password for each deployment,
    and rotate any passwords already deployed with the committed values.
  - Make the app container read the same secret instead of the default credentials
    from config.inc.php.dist.
  verification: Run grep -nE 'MYSQL_(ROOT_)?PASSWORD=' compose.yml and confirm it
    finds only variable references, not literal values. Then run docker compose config
    and confirm the passwords come from secrets or environment variables.
  reference: https://cwe.mitre.org/data/definitions/798.html
  file: compose.yml
  line: 31
