trust_boundaries:
- assumption: Every query reaches SQLite through Sequelize parameter binding, never
    through concatenated SQL text.
  assumption_legs:
  - condition: Request-derived values reach SQLite only as bound parameters, never
      concatenated into raw SQL strings.
    leg: data-interpretation
  confidence: confirmed
  covers_components:
  - component-290ae722e9565831
  - component-b213d5ab01236933
  enforcement_point: Sequelize parameter binding
  evidence:
  - file: models/index.ts
    line: 41
  from: component-290ae722e9565831
  id: tb-5
  kind: process
  name: 'App to SQLite store: Sequelize parameter binding'
  resolution_status: resolved
  sources:
  - detected
  surface: in-process
  to: component-b213d5ab01236933
  transition:
  - data-access
  assumption_verdict: clean
- assumption: The server fetches only URLs that resolve to public image hosts, never
    internal or metadata addresses.
  assumption_legs:
  - condition: Only the bare GET request leaves; no credentials or internal headers
      are attached to the fetch.
    leg: egress-content
  - condition: The imageUrl host is restricted to public addresses before routes/profileImageUrlUpload.ts
      calls fetch().
    leg: egress-destination
  - condition: Fetched bytes are validated as an image before being written under
      the public uploads directory.
    leg: response-trust
  confidence: confirmed
  evidence:
  - file: routes/profileImageUrlUpload.ts
    line: 24
  - file: lib/webhook.ts
    line: 18
  - file: routes/chat.ts
    line: 108
  - file: lib/startup/validatePreconditions.ts
    line: 236
  from: component-3214f59f17b5ed30
  id: tb-6
  kind: third-party
  name: 'Profile image URL fetch: no egress control identified'
  resolution_status: resolved
  sources:
  - detected
  surface: network
  to: external
  transition:
