    each job's GITHUB_TOKEN inherits the repository default scope, which on legacy-default
    repositories is read-write across contents, packages and more. A compromised action
    or injected step in the build, scan or vulnerable jobs can push commits, create
    releases or overwrite packages beyond what the job needs.
