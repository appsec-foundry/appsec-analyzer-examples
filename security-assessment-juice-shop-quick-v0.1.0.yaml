tier_root_causes:
  edge:
  - Angular sanitizer bypassed by trusting HTML into innerHTML sinks
  - Bearer token kept in script-readable localStorage
  - Credentials and tokens placed in URLs and sent to any origin
  - Client-side derived secrets and role checks trusted without server proof
  - OAuth flows lack state, PKCE and server-side token verification
  server:
  - Request-supplied IDs used without session-bound ownership checks
  - User input interpolated into SQL, $where, eval and template sources
  - JWT decoded or verified without signature or algorithm allowlist
  - Routes lack authentication or role-based authorization
  - Hardcoded keys, weak RNG and unenforced server-side business rules
  data:
  - Passwords hashed with unsalted MD5 and security answers with a static key
  - Sensitive card data stored in plaintext without encryption or tokenization
  - Models return sensitive joined attributes without field allowlists
