  risk: High
  scenario: At vulnerabilities/xss_d/index.php:53, an inline script takes the text
    after 'default=' from location.href, decodes it with decodeURI, and writes it
    unencoded with document.write. An attacker sends a logged-in victim a link to
    the xss_d page, such as ?default=<script>...</script> or ?default=</option></select><img
    src=x onerror=alert(document.cookie)>. The attacker's script then runs in the
    victim's DVWA session. The low level applies no encoding. medium.php rejects input
    containing '<script', and high.php allowlists language names on the server. At
    the high level, however, the payload can go in a fragment (#default=...) that
    never reaches the server. The impossible level drops decodeURI.
