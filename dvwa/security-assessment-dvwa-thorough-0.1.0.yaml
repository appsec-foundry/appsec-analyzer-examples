  evidence:
  - file: .github/workflows/vulnerable.yml
    line: 54
  evidence_basis: llm-verified
  evidence_check: verified
  evidence_summary: vulnerable.yml:31 sets ALLMYSECRETS to toJSON(secrets); line 51
    pipes SUPER_SECRET through base64 and line 54 pipes ALLMYSECRETS through base64,
    both into the job log. The job runs on every push to master (lines 3-6).
  evidence_tier: insecure-practice
  found_by:
  - survey
  impact: High
  impact_description: All repository secrets, plus the job's GITHUB_TOKEN while the
    job runs, are disclosed to anyone who can read the workflow logs.
  likelihood: High
  local_id: component-8e8c82f91b0e01fb-001
  mitigation_title: Remove secret-echoing workflow and rotate exposed secrets
  primary_actor: ACT-D-06
  remediation:
    effort: Low
    reference: https://cwe.mitre.org/data/definitions/532.html
    steps:
    - Delete .github/workflows/vulnerable.yml, or remove the get_secrets job.
    - Rotate every repository and organisation secret that was available to the workflow,
      including DVWA_SECRET_KEY.
    - Delete historical workflow run logs that contain the base64-encoded output.
    - Never pass toJSON(secrets) into a step; reference only the specific secret a
      step needs.
    verification: Run `grep -rn 'toJSON(secrets)\|base64' .github/workflows/` and
      confirm no hits. Confirm that previously exposed secret values no longer authenticate.
  risk: High
  scenario: On every push to master the get_secrets job serialises every repository
    secret with toJSON(secrets) and echoes it piped through base64. GitHub's log masking
    only redacts exact secret strings, so the encoded output appears in clear in the
    run log. Anyone who can read Actions logs, which means any internet user if the
    repository is public, can decode it and recover DVWA_SECRET_KEY and every other
    configured secret.
  source: stride
  stride: Information Disclosure
