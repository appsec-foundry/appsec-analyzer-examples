    at lib/insecurity.ts:41 is a fast unsalted MD5 digest with no work factor; it
    is used to store and compare passwords and in login, 2FA setup and disable. An
    attacker who obtains the SQLite file, a SQL injection dump, the user table or
    the hash carried in a token payload can crack passwords quickly with rainbow tables
    or GPU brute force and take over accounts. The scanner also flags MD5/SHA-1 as
    collision-broken primitives, forgeable for integrity of attacker-influenced data.
