verdict:
  severity: red
  opening: This deliberately vulnerable web application lets attackers run commands
    on the server, read or rewrite the whole database, and wipe it. It is acceptable
    only as an isolated training target, never holding real data or reachable from
    outside a training network.
  bullets:
  - title: Server takeover without signing in
    body: Operating system command injection lets an unauthenticated visitor run commands
      as the web server user.
    findings:
    - F-005
    weaknesses:
    - W-001
    verified_attack_path: false
  - title: Database read and rewritten by any user
    body: SQL injection in several pages lets a signed-in or anonymous user dump password
      hashes and change account records.
    findings:
    - F-012
    - F-013
    - F-014
    - F-015
    - F-016
    weaknesses: []
    verified_attack_path: false
  - title: Data extracted despite input escaping
    body: Blind and escaping-bypass SQL injection variants let a signed-in user infer
      or read database contents.
    findings:
    - F-017
    - F-018
    - F-019
    - F-020
    weaknesses: []
    verified_attack_path: false
  - title: Entire database wiped by anyone
    body: The setup page needs no login, so any visitor can destroy all data and reset
      the administrator password.
    findings:
    - F-036
    weaknesses: []
    verified_attack_path: false
  - title: Forged login tokens grant admin access
    body: A hard-coded encryption key and weak token design let anyone mint or splice
      tokens that the service accepts as administrator.
    findings:
    - F-039
    - F-006
    weaknesses:
    - W-004
    - W-005
    verified_attack_path: true
  - title: Build pipeline leaks every repository secret
    body: Anyone able to read the public workflow logs obtains all repository secrets,
      including the build token.
    findings:
    - F-027
    weaknesses:
    - W-009
    verified_attack_path: false
  closing: 'Treat this system as a disposable lab asset: keep it off shared networks
    and load no real data until the structural gaps are closed.'
  bullets_intro: 'Security concerns behind this assessment:'
