  - Add a regression test (or CI check) that fails on the vulnerable pattern and passes
    once the fix is in place.
  verification: Re-run the IAC-002 scanner check; it reports no match at Dockerfile:1,
    and the regression test passes.
  file: Dockerfile
  line: 1
- id: M-009
