- id: M-014
  title: Pin the container base image to an immutable digest
  kind: fix
  priority: P3
  severity: Medium
  threat_ids:
  - T-042
  how: Pin base image to @sha256:<digest> — Tag-only base images (FROM node:24) can
    be silently substituted by a malicious publisher. Digest-pinning (@sha256:…) ensures
    the exact image bytes are used on every build.
  effort: Low
  auto_emitted: true
  auto_source: config-scan
  _title_source: Dockerfile base image must be digest-pinned
  steps:
  - Reference base images as image:tag@sha256:digest in all Dockerfiles.
  - Use Renovate or Dependabot to update digests.
  - Pin coverallsapp/github-action and github/codeql-action to full commit SHAs with
    version comments.
  - Replace @main and @v8 refs in image_actions.yml with full commit SHAs and add
    explicit least-privilege permissions to the job.
  - Pin actions/checkout@v6 to a SHA as well.
  - Enable Dependabot for github-actions to keep pins current.
  verification: 'Run docker buildx imagetools inspect on each FROM to confirm digests
    match pinned values, and grep workflows for uses: lines lacking a 40-hex SHA and
    confirm none remain.'
  file: Dockerfile
  line: 1
